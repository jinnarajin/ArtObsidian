<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtObsidian</title>
<style>
  :root {
    --bg: #1e1e2e; --bg2: #181825; --bg3: #11111b;
    --fg: #cdd6f4; --muted: #6c7086; --accent: #a78bfa;
    --border: #313244;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; height: 100vh; overflow: hidden;
  }
  #sidebar {
    width: 250px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  #sidebar header {
    padding: 10px 12px; display: flex; gap: 6px; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  #sidebar header b { color: var(--accent); font-size: 14px; flex: 1; }
  .icon-btn {
    background: var(--bg3); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px; width: 26px; height: 26px; font-size: 13px; cursor: pointer; line-height: 1;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  #vaultBar {
    padding: 6px 12px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden;
  }
  #vaultBar button {
    background: none; border: 1px solid var(--border); color: var(--accent);
    border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  #search {
    margin: 8px; padding: 6px 8px; background: var(--bg3); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; font-size: 13px;
  }
  #search:focus { outline: 1px solid var(--accent); }
  #tree { flex: 1; overflow-y: auto; padding: 4px 4px 20px; }
  .tree-folder, .tree-note {
    padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap; overflow: hidden; user-select: none;
  }
  .tree-folder { color: var(--muted); font-weight: 600; }
  .tree-folder:hover, .tree-note:hover { background: var(--bg); }
  .tree-note.active { background: var(--border); color: var(--accent); }
  .tree-note span, .tree-folder span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tree-note .del {
    color: var(--muted); background: none; border: none; cursor: pointer;
    font-size: 11px; visibility: hidden; padding: 0 2px;
  }
  .tree-note:hover .del { visibility: visible; }
  .del:hover { color: #f38ba8; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  #toolbar {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
  }
  #titleInput {
    flex: 1; background: none; border: none; color: var(--fg);
    font-size: 16px; font-weight: 600; min-width: 0;
  }
  #titleInput:focus { outline: none; }
  #folderLabel { font-size: 11px; color: var(--muted); }
  .mode-btn {
    background: var(--bg2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .mode-btn.on { color: var(--accent); border-color: var(--accent); }
  #panes { flex: 1; display: flex; min-height: 0; }
  #editorWrap { flex: 1; position: relative; display: flex; min-width: 0; }
  #editor, #preview { flex: 1; padding: 24px; overflow-y: auto; min-width: 0; }
  #editor {
    background: none; color: var(--fg); border: none; resize: none;
    font-family: ui-monospace, monospace; font-size: 14px; line-height: 1.7;
  }
  #editor:focus { outline: none; }
  #preview { border-left: 1px solid var(--border); line-height: 1.7; font-size: 15px; }
  #preview h1, #preview h2, #preview h3 { margin: 0.8em 0 0.4em; }
  #preview h1 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  #preview p, #preview ul, #preview ol, #preview pre, #preview blockquote { margin: 0.5em 0; }
  #preview ul, #preview ol { padding-left: 1.5em; }
  #preview code { background: var(--bg3); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
  #preview pre { background: var(--bg3); padding: 12px; border-radius: 6px; overflow-x: auto; }
  #preview pre code { padding: 0; background: none; }
  #preview blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); }
  #preview a { color: var(--accent); }
  a.wikilink { color: var(--accent); cursor: pointer; text-decoration: none; border-bottom: 1px dashed var(--accent); }
  a.wikilink.missing { color: var(--muted); border-bottom-color: var(--muted); }
  /* 자동완성 */
  #autocomplete {
    position: absolute; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 6px; box-shadow: 0 4px 16px #0008; z-index: 10;
    max-height: 200px; overflow-y: auto; min-width: 180px; display: none;
  }
  #autocomplete div { padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #autocomplete div.sel { background: var(--border); color: var(--accent); }
  /* 그래프 */
  #graphView {
    position: absolute; inset: 0; background: var(--bg); z-index: 20; display: none;
  }
  #graphView canvas { width: 100%; height: 100%; display: block; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div id="sidebar">
  <header>
    <b>◆ ArtObsidian</b>
    <button class="icon-btn" id="newNoteBtn" title="새 노트">+</button>
    <button class="icon-btn" id="newFolderBtn" title="새 폴더">📁</button>
    <button class="icon-btn" id="graphBtn" title="그래프 뷰">◉</button>
  </header>
  <div id="vaultBar"><button id="openVaultBtn">폴더 열기</button><span id="vaultName">localStorage 모드</span></div>
  <input id="search" placeholder="노트 검색...">
  <div id="tree"></div>
</div>
<div id="main">
  <div id="toolbar">
    <span id="folderLabel"></span>
    <input id="titleInput" placeholder="제목">
    <button class="mode-btn" data-mode="edit">편집</button>
    <button class="mode-btn on" data-mode="split">분할</button>
    <button class="mode-btn" data-mode="read">읽기</button>
  </div>
  <div id="panes">
    <div id="editorWrap">
      <textarea id="editor" placeholder="마크다운으로 작성하세요. [[ 를 입력하면 노트 자동완성이 뜹니다." spellcheck="false"></textarea>
      <div id="autocomplete"></div>
    </div>
    <div id="preview"></div>
  </div>
  <div id="graphView"><canvas id="graphCanvas"></canvas></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ---- 상태 ----
// note: { path: "folder/sub/제목.md", title, body, updated }
let notes = [];
let folders = new Set();          // 명시적 폴더 경로 ("a/b")
let dirRoot = null;               // FileSystemDirectoryHandle (로컬 vault 모드)
let serverMode = false;           // server.py의 /api 사용 (서버 vault 모드)
let currentPath = null;
let mode = 'split';
let openFolders = new Set(JSON.parse(localStorage.getItem('openFolders') || '[]'));

const folderOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const fileOf = p => p.slice(p.lastIndexOf('/') + 1);
const current = () => notes.find(n => n.path === currentPath);
const byTitle = t => notes.find(n => n.title === t.trim());

// ---- 저장 (localStorage 또는 실제 파일) ----
function saveLocal() {
  if (dirRoot || serverMode) return;
  localStorage.setItem('vault', JSON.stringify({ notes, folders: [...folders] }));
}
async function ensureDir(folder) {
  let h = dirRoot;
  for (const part of folder.split('/').filter(Boolean))
    h = await h.getDirectoryHandle(part, { create: true });
  return h;
}
async function writeFile(note) {
  if (serverMode) {
    const r = await fetch('/api/note?path=' + encodeURIComponent(note.path), { method: 'PUT', body: note.body });
    note.mtime = (await r.json()).mtime;
    return;
  }
  if (!dirRoot) return saveLocal();
  const dir = await ensureDir(folderOf(note.path));
  const fh = await dir.getFileHandle(fileOf(note.path), { create: true });
  const w = await fh.createWritable();
  await w.write(note.body);
  await w.close();
  note.mtime = (await fh.getFile()).lastModified;
}
async function removeFile(path) {
  if (serverMode) { await fetch('/api/note?path=' + encodeURIComponent(path), { method: 'DELETE' }); return; }
  if (!dirRoot) return saveLocal();
  const dir = await ensureDir(folderOf(path));
  await dir.removeEntry(fileOf(path)).catch(() => {});
}
let saveTimer;
function scheduleSave(note) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => writeFile(note), 400);
}

// ---- Vault 열기 ----
$('openVaultBtn').onclick = async () => {
  if (!window.showDirectoryPicker) return alert('이 브라우저는 File System Access API를 지원하지 않습니다 (Chrome/Edge + http(s) 필요). localStorage 모드로 계속 사용됩니다.');
  try { dirRoot = await showDirectoryPicker({ mode: 'readwrite' }); } catch { return; }
  notes = []; folders = new Set();
  await scan(dirRoot, '');
  $('vaultName').textContent = '📂 ' + dirRoot.name;
  currentPath = notes[0]?.path || null;
  renderAll();
};
async function scan(dir, prefix) {
  for await (const entry of dir.values()) {
    if (entry.name.startsWith('.')) continue;
    if (entry.kind === 'directory') {
      folders.add(prefix + entry.name);
      await scan(entry, prefix + entry.name + '/');
    } else if (entry.name.endsWith('.md')) {
      const file = await entry.getFile();
      notes.push({ path: prefix + entry.name, title: entry.name.replace(/\.md$/, ''), body: await file.text(), mtime: file.lastModified, updated: Date.now() });
    }
  }
}

// ---- 파일 감시 (폴링) ----
// ponytail: File System Access API에 watch가 없어 3초 폴링. 대형 vault면 주기 늘리기
async function pollVault() {
  // disk: path -> { mtime, text() } — 로컬 vault든 서버 vault든 같은 형태로 수집
  const disk = new Map(), diskFolders = new Set();
  if (serverMode) {
    try {
      const d = await (await fetch('/api/list')).json();
      d.folders.forEach(f => diskFolders.add(f));
      d.notes.forEach(n => disk.set(n.path, { mtime: n.mtime, text: async () => n.body }));
    } catch { return; }
  } else if (dirRoot) {
    async function walk(dir, prefix) {
      for await (const entry of dir.values()) {
        if (entry.name.startsWith('.')) continue;
        if (entry.kind === 'directory') { diskFolders.add(prefix + entry.name); await walk(entry, prefix + entry.name + '/'); }
        else if (entry.name.endsWith('.md')) {
          const file = await entry.getFile();
          disk.set(prefix + entry.name, { mtime: file.lastModified, text: () => file.text() });
        }
      }
    }
    try { await walk(dirRoot, ''); } catch { return; }
  } else return;
  let changed = false;
  for (const [path, rec] of disk) {
    const n = notes.find(n => n.path === path);
    if (!n) {
      notes.push({ path, title: fileOf(path).replace(/\.md$/, ''), body: await rec.text(), mtime: rec.mtime, updated: Date.now() });
      changed = true;
    } else if (rec.mtime > (n.mtime || 0)) {
      n.body = await rec.text(); n.mtime = rec.mtime;
      changed = true;
    }
  }
  const before = notes.length;
  notes = notes.filter(n => disk.has(n.path));
  if (notes.length !== before) changed = true;
  if ([...diskFolders].some(f => !folders.has(f))) { folders = diskFolders; changed = true; }
  if (!changed) return;
  if (!current()) currentPath = notes[0]?.path || null;
  renderTree();
  // 편집 중인 노트를 덮어쓰지 않도록, 에디터에 포커스 없을 때만 본문 갱신
  if (document.activeElement !== $('editor')) renderMain();
}
setInterval(pollVault, 3000);

// ---- 마크다운 렌더 ----
// ponytail: 정규식 기반 미니 파서. 중첩 목록/표 필요해지면 marked.js로 교체
function md(src) {
  return src.split(/\n{2,}/).map(b => {
    b = b.trim();
    if (!b) return '';
    if (b.startsWith('```')) return '<pre><code>' + esc(b.replace(/^```\w*\n?|```$/g, '')) + '</code></pre>';
    const inline = t => esc(t)
      .replace(/\[\[([^\]]+)\]\]/g, (_, name) =>
        `<a class="wikilink${byTitle(name) ? '' : ' missing'}" data-link="${name.trim()}">${name}</a>`)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/\*([^*]+)\*/g, '<i>$1</i>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    const h = b.match(/^(#{1,6}) (.+)/);
    if (h) return `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    if (b.startsWith('> ')) return '<blockquote>' + inline(b.replace(/^> /gm, '')) + '</blockquote>';
    if (/^[-*] /m.test(b)) return '<ul>' + b.split('\n').map(l => '<li>' + inline(l.replace(/^[-*] /, '')) + '</li>').join('') + '</ul>';
    if (/^\d+\. /m.test(b)) return '<ol>' + b.split('\n').map(l => '<li>' + inline(l.replace(/^\d+\. /, '')) + '</li>').join('') + '</ol>';
    if (/^---+$/.test(b)) return '<hr>';
    return '<p>' + inline(b).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

// ---- 사이드바 폴더 트리 ----
function renderTree() {
  const q = $('search').value.toLowerCase();
  const matched = q
    ? notes.filter(n => n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q))
    : notes;
  const allFolders = new Set(folders);
  matched.forEach(n => { let f = folderOf(n.path); while (f) { allFolders.add(f); f = folderOf(f); } });

  function level(folder, depth) {
    let html = '';
    const subs = [...allFolders].filter(f => folderOf(f) === folder && f !== '').sort();
    for (const f of subs) {
      const open = q || openFolders.has(f);
      html += `<div class="tree-folder" data-folder="${esc(f)}" style="padding-left:${8 + depth * 14}px">
        <span>${open ? '▾' : '▸'} 📁 ${esc(fileOf(f))}</span></div>`;
      if (open) html += level(f, depth + 1);
    }
    const inFolder = matched.filter(n => folderOf(n.path) === folder).sort((a, b) => b.updated - a.updated);
    for (const n of inFolder)
      html += `<div class="tree-note${n.path === currentPath ? ' active' : ''}" data-path="${esc(n.path)}" style="padding-left:${8 + depth * 14}px">
        <span>${esc(n.title) || '(제목 없음)'}</span><button class="del" data-del="${esc(n.path)}">✕</button></div>`;
    return html;
  }
  $('tree').innerHTML = level('', 0);
}

function renderMain() {
  const n = current();
  if (!n) { $('titleInput').value = ''; $('editor').value = ''; $('preview').innerHTML = ''; $('folderLabel').textContent = ''; return; }
  $('folderLabel').textContent = folderOf(n.path) ? folderOf(n.path) + ' /' : '';
  $('titleInput').value = n.title;
  $('editor').value = n.body;
  $('preview').innerHTML = md(n.body);
  $('editor').style.display = mode === 'read' ? 'none' : '';
  $('preview').style.display = mode === 'edit' ? 'none' : '';
}
function renderAll() { renderTree(); renderMain(); }

function openNote(path) { currentPath = path; hideGraph(); renderAll(); }

async function createNote(title, folder = '') {
  const path = (folder ? folder + '/' : '') + title + '.md';
  let n = notes.find(n => n.path === path);
  if (!n) {
    n = { path, title, body: '', updated: Date.now() };
    notes.push(n);
    await writeFile(n);
  }
  openNote(n.path);
  return n;
}

// ---- 사이드바 이벤트 ----
$('newNoteBtn').onclick = async () => {
  const folder = current() ? folderOf(current().path) : '';
  let i = notes.length + 1, title;
  do { title = '새 노트 ' + i++; } while (byTitle(title));
  await createNote(title, folder);
  $('titleInput').focus(); $('titleInput').select();
};
$('newFolderBtn').onclick = async () => {
  const name = prompt('폴더 이름 (예: 프로젝트 또는 프로젝트/아이디어)');
  if (!name) return;
  folders.add(name.replace(/^\/+|\/+$/g, ''));
  openFolders.add(name);
  if (serverMode) await fetch('/api/folder?path=' + encodeURIComponent(name), { method: 'POST' });
  else if (dirRoot) await ensureDir(name); else saveLocal();
  renderTree();
};
$('search').oninput = renderTree;
$('tree').onclick = async e => {
  const del = e.target.dataset.del;
  if (del) {
    if (!confirm('이 노트를 삭제할까요?')) return;
    notes = notes.filter(n => n.path !== del);
    await removeFile(del);
    if (currentPath === del) currentPath = notes[0]?.path || null;
    renderAll();
    return;
  }
  const folderEl = e.target.closest('.tree-folder');
  if (folderEl) {
    const f = folderEl.dataset.folder;
    openFolders.has(f) ? openFolders.delete(f) : openFolders.add(f);
    localStorage.setItem('openFolders', JSON.stringify([...openFolders]));
    renderTree();
    return;
  }
  const noteEl = e.target.closest('.tree-note');
  if (noteEl) openNote(noteEl.dataset.path);
};

// ---- 편집 이벤트 ----
$('titleInput').oninput = e => {
  const n = current(); if (!n) return;
  n.title = e.target.value; n.updated = Date.now();
  renderTree();
};
$('titleInput').onchange = async e => {   // blur/enter 시 실제 파일 rename
  const n = current(); if (!n) return;
  const oldPath = n.path;
  n.path = (folderOf(oldPath) ? folderOf(oldPath) + '/' : '') + (n.title || '제목 없음') + '.md';
  if (n.path !== oldPath) { await writeFile(n); await removeFile(oldPath); currentPath = n.path; }
  saveLocal(); renderTree();
};
$('editor').oninput = e => {
  const n = current(); if (!n) return;
  n.body = e.target.value; n.updated = Date.now();
  $('preview').innerHTML = md(n.body);
  scheduleSave(n);
  updateAutocomplete();
};
$('preview').onclick = async e => {
  const link = e.target.dataset.link;
  if (!link) return;
  const existing = byTitle(link);
  existing ? openNote(existing.path) : await createNote(link, current() ? folderOf(current().path) : '');
};
document.querySelectorAll('.mode-btn').forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.mode-btn').forEach(x => x.classList.toggle('on', x === b));
  renderMain();
});

// ---- [[ 자동완성 ----
let acItems = [], acSel = 0;
function caretXY(textarea) {  // 미러 div로 캐럿 좌표 계산
  const div = document.createElement('div');
  const style = getComputedStyle(textarea);
  for (const p of ['fontFamily','fontSize','lineHeight','padding','border','boxSizing','whiteSpace','wordWrap','width'])
    div.style[p] = style[p];
  div.style.cssText += 'position:absolute;visibility:hidden;white-space:pre-wrap;word-wrap:break-word;';
  div.style.width = textarea.clientWidth + 'px';
  div.textContent = textarea.value.slice(0, textarea.selectionStart);
  const marker = document.createElement('span');
  marker.textContent = '​';
  div.appendChild(marker);
  textarea.parentNode.appendChild(div);
  const xy = { x: marker.offsetLeft, y: marker.offsetTop - textarea.scrollTop };
  div.remove();
  return xy;
}
function acQuery() {
  const ed = $('editor');
  const upto = ed.value.slice(0, ed.selectionStart);
  const m = upto.match(/\[\[([^\[\]\n]*)$/);
  return m ? m[1] : null;
}
function updateAutocomplete() {
  const q = acQuery();
  const box = $('autocomplete');
  if (q === null) { box.style.display = 'none'; return; }
  acItems = notes.filter(n => n.path !== currentPath && n.title.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
  if (!acItems.length) { box.style.display = 'none'; return; }
  acSel = Math.min(acSel, acItems.length - 1);
  box.innerHTML = acItems.map((n, i) =>
    `<div class="${i === acSel ? 'sel' : ''}" data-i="${i}">${esc(n.title)}<span style="color:var(--muted);font-size:11px"> ${esc(folderOf(n.path))}</span></div>`).join('');
  const { x, y } = caretXY($('editor'));
  box.style.left = Math.min(x, $('editorWrap').clientWidth - 200) + 'px';
  box.style.top = (y + 26) + 'px';
  box.style.display = 'block';
}
function acInsert(i) {
  const ed = $('editor'), n = acItems[i];
  const upto = ed.value.slice(0, ed.selectionStart);
  const start = upto.lastIndexOf('[[');
  const after = ed.value.slice(ed.selectionStart);
  const closed = after.startsWith(']]') ? after.slice(2) : after;
  ed.value = ed.value.slice(0, start) + '[[' + n.title + ']]' + closed;
  const pos = start + n.title.length + 4;
  ed.setSelectionRange(pos, pos);
  $('autocomplete').style.display = 'none';
  ed.dispatchEvent(new Event('input'));
  ed.focus();
}
$('editor').addEventListener('keydown', e => {
  if ($('autocomplete').style.display !== 'block') return;
  if (e.key === 'ArrowDown') { acSel = (acSel + 1) % acItems.length; updateAutocomplete(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acSel = (acSel - 1 + acItems.length) % acItems.length; updateAutocomplete(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === 'Return' || e.key === 'Tab') { acInsert(acSel); e.preventDefault(); }
  else if (e.key === 'Escape') { $('autocomplete').style.display = 'none'; e.preventDefault(); }
});
$('editor').addEventListener('click', updateAutocomplete);
$('autocomplete').onmousedown = e => {
  const i = e.target.closest('[data-i]')?.dataset.i;
  if (i !== undefined) { acInsert(+i); e.preventDefault(); }
};

// ---- 그래프 뷰 ----
let graphOn = false, graphNodes = [], graphAnim;
$('graphBtn').onclick = () => graphOn ? hideGraph() : showGraph();
function hideGraph() {
  if (!graphOn) return;
  graphOn = false;
  cancelAnimationFrame(graphAnim);
  $('graphView').style.display = 'none';
}
function showGraph() {
  graphOn = true;
  $('autocomplete').style.display = 'none';
  const view = $('graphView'), cv = $('graphCanvas');
  view.style.display = 'block';
  cv.width = view.clientWidth * devicePixelRatio;
  cv.height = view.clientHeight * devicePixelRatio;
  const W = view.clientWidth, H = view.clientHeight;
  const ctx = cv.getContext('2d');
  ctx.scale(devicePixelRatio, devicePixelRatio);

  // 노드/엣지 구성: 위키링크 = 엣지
  graphNodes = notes.map((n, i) => ({
    note: n,
    x: W / 2 + Math.cos(i * 2.4) * (60 + i * 7),   // 결정적 초기 배치 (골든앵글 나선)
    y: H / 2 + Math.sin(i * 2.4) * (60 + i * 7),
    vx: 0, vy: 0
  }));
  const edges = [];
  for (const a of graphNodes)
    for (const m of a.note.body.matchAll(/\[\[([^\]]+)\]\]/g)) {
      const b = graphNodes.find(g => g.note.title === m[1].trim());
      if (b && b !== a) edges.push([a, b]);
    }
  const degree = n => edges.filter(([a, b]) => a === n || b === n).length;

  // ponytail: O(n²) 포스 시뮬레이션 — 노트 수백 개까진 충분, 수천 개면 쿼드트리 필요
  function tick() {
    for (const a of graphNodes) {
      for (const b of graphNodes) {
        if (a === b) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = Math.max(dx * dx + dy * dy, 25);
        const f = 1800 / d2;
        a.vx += dx / Math.sqrt(d2) * f; a.vy += dy / Math.sqrt(d2) * f;
      }
      a.vx += (W / 2 - a.x) * 0.003; a.vy += (H / 2 - a.y) * 0.003;
    }
    for (const [a, b] of edges) {
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const f = (d - 110) * 0.01;
      a.vx += dx / d * f; a.vy += dy / d * f;
      b.vx -= dx / d * f; b.vy -= dy / d * f;
    }
    for (const n of graphNodes) {
      n.vx *= 0.85; n.vy *= 0.85;
      n.x += n.vx; n.y += n.vy;
    }
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#45475a'; ctx.lineWidth = 1;
    for (const [a, b] of edges) { ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
    for (const n of graphNodes) {
      const r = 5 + Math.min(degree(n), 6);
      ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7);
      ctx.fillStyle = n.note.path === currentPath ? '#a78bfa' : '#89b4fa';
      ctx.fill();
      ctx.fillStyle = '#cdd6f4';
      ctx.fillText(n.note.title, n.x, n.y + r + 13);
    }
    graphAnim = requestAnimationFrame(tick);
  }
  tick();
  cv.onclick = e => {
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const hit = graphNodes.find(n => Math.hypot(n.x - x, n.y - y) < 14);
    if (hit) openNote(hit.note.path);
  };
}

// ---- 초기화 ----
(async function init() {
  try {   // server.py로 서비스 중이면 자동으로 서버 vault 모드
    const d = await (await fetch('/api/list')).json();
    serverMode = true;
    folders = new Set(d.folders);
    notes = d.notes.map(n => ({ path: n.path, title: fileOf(n.path).replace(/\.md$/, ''), body: n.body, mtime: n.mtime, updated: n.mtime }));
    $('vaultName').textContent = '🌐 서버 vault';
    $('openVaultBtn').style.display = 'none';
  } catch {}
  if (!serverMode) {
    const stored = JSON.parse(localStorage.getItem('vault') || 'null');
    if (stored) { notes = stored.notes; folders = new Set(stored.folders); }
  }
  if (!notes.length) notes = [{
    path: '시작하기.md', title: '시작하기', updated: Date.now(),
    body: '# 환영합니다\n\nArtObsidian은 미니 옵시디언 클론입니다.\n\n- `[[` 입력 → **노트 자동완성**\n- 상단 📁 버튼 → 폴더 생성\n- 상단 ◉ 버튼 → **그래프 뷰**\n- "폴더 열기" → 실제 디스크의 .md 파일로 저장 (Chrome/Edge)\n\n연결 예시: [[아이디어]] 노트를 만들어보세요.'
  }];
  if (serverMode && !notes[0].mtime) await writeFile(notes[0]);   // 빈 서버 vault면 시작 노트를 파일로 생성
  currentPath = notes[0].path;
  renderAll();
})();
</script>
